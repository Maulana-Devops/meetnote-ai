server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Pertahanan berlapis. connect-src mencakup origin backend default dan
    # https; sesuaikan bila VITE_API_BASE_URL memakai host lain.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: http://localhost:8000 http://127.0.0.1:8000 https:; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000 https:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # React Router / SPA fallback: rute non-file dikembalikan ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
